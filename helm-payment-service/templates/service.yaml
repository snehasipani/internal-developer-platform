apiVersion: v1
kind: Service
metadata:
  name: payment-service-stable
  namespace: payment
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-canary
  namespace: payment
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
