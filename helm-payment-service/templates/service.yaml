apiVersion: v1
kind: Service
metadata:
  name: payment-service-stable
  namespace: payment
  labels:
    app: payment-service
    monitoring: prometheus
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: metrics
      port: 80
      targetPort: 3000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-canary
  namespace: payment
  labels:
    app: payment-service
    monitoring: prometheus
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: metrics
      port: 80
      targetPort: 3000
      protocol: TCP
